[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asset-summary"
version = "0.1.0"
description = "Personal asset summary dashboard (stocks, funds, cash, metals, real estate) - sibling of Crypto-Summary"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "openpyxl>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
asset-summary = "asset_summary.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
asset_summary = ["web/static/*"]
